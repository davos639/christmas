<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#21463a">
<title>Різдвяний лайв — регламент</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<style>
:root{--bg:#f4efe4;--paper:#fffdf8;--ink:#1d2621;--muted:#6f726b;--faint:#a19e94;--line:#e3dac8;--line2:#efe8da;--green:#2c5a45;--green-d:#21463a;--red:#a63a30;--gold:#d2a23e;--shadow:0 1px 2px rgba(40,30,10,.06),0 8px 24px -10px rgba(40,30,10,.18)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{flex-shrink:0;display:inline-block;vertical-align:middle}
#app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}

.top{display:flex;align-items:center;gap:10px;padding:12px 22px;background:var(--green-d);color:#f6efe0}
.top .ic{color:var(--gold)}
.album{font-family:"Playfair Display",serif;font-size:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.stage{overflow:auto;display:flex;flex-direction:column;min-width:0}
.song-head{display:flex;align-items:flex-end;gap:14px 18px;padding:18px 26px 14px;flex-wrap:wrap}
.song-id{flex:1;min-width:240px}
.song-num{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:0 0 2px}
.song-title{font-family:"Playfair Display",serif;font-size:32px;font-weight:600;margin:0;line-height:1.15}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:12px;color:var(--muted);font-weight:600}
.field b{font-size:14px;color:var(--ink)}
.field .ic{color:var(--faint)}
.field.q b{color:var(--faint);font-weight:600}
.field.rec{color:var(--ink);font-weight:500;font-size:12.5px}
.field.rec .ic{color:var(--gold)}

.arr-wrap{flex:1;overflow:auto;margin:0 18px 18px;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);position:relative;min-height:200px}
.arr{display:grid;min-width:max-content}
.corner,.row-label{position:sticky;left:0;z-index:2;background:var(--paper);border-right:1px solid var(--line)}
.corner{top:0;z-index:4;border-bottom:1px solid var(--line);padding:14px;display:flex;align-items:flex-end}
.corner b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.sec-head{--sc:#888;position:sticky;top:0;z-index:3;background:var(--paper);border-bottom:1px solid var(--line);border-left:1px solid var(--line2);padding:0 10px 9px}
.sec-strip{height:5px;background:var(--sc);margin:0 -10px 8px}
.sec-type{display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sc);height:16px}
.sec-name{font-weight:700;font-size:14px;margin:3px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600;min-height:18px}
.delta{margin-left:auto;display:flex;gap:4px}
.delta i{font-style:normal;font-weight:800;padding:1px 6px;border-radius:999px;font-size:11px}
.delta .in{background:#e3efe6;color:#2c6a46}
.delta .out{background:#f3e3df;color:#9a3b30}

.row-label{display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;height:46px;border-bottom:1px solid var(--line2)}
.row-ic{display:flex;color:var(--c)}
.row-name{font-weight:600;font-size:13.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{--c:#888;position:relative;height:46px;border-bottom:1px solid var(--line2);border-left:1px solid var(--line2)}
.cell.odd{background:#fbf8f1}
.bar{position:absolute;top:9px;bottom:9px;left:-1px;right:0;background:var(--c);display:flex;align-items:center;overflow:hidden;z-index:1}
.bar.s{left:6px;border-radius:8px 0 0 8px}
.bar.e{right:6px;border-radius:0 8px 8px 0}
.bar.s.e{border-radius:8px}
.bar span{color:#fff;font-size:11.5px;font-weight:700;padding:0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 1px rgba(0,0,0,.18)}

.note-label{gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);align-items:flex-start;padding-top:12px;height:auto;min-height:50px}
.note-label.mine{color:#a07d2a;min-height:74px;border-bottom:0}
.note-cell{border-left:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:10px 10px;font-size:12px;line-height:1.4;color:var(--muted)}
.my-cell{border-left:1px solid var(--line2);padding:6px;background:#fffaf0}
.my-cell textarea{width:100%;height:62px;resize:vertical;border:1px solid transparent;border-radius:8px;background:transparent;padding:6px 7px;font-size:12px;line-height:1.4}
.my-cell textarea:hover{border-color:var(--line)}
.my-cell textarea:focus{outline:none;border-color:var(--gold);background:#fff}
.my-cell textarea::placeholder{color:#c9c2b2}
.mine-hint{font-size:11.5px;color:var(--faint);margin:-8px 26px 18px;display:flex;align-items:center;gap:6px}

.songs{background:var(--paper);border-top:1px solid var(--line);padding:10px 18px 14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.song-list{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 4px}
.song-card{position:relative;flex:0 0 210px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px 11px;cursor:pointer;text-align:left;transition:border-color .12s,transform .12s}
.song-card:hover{border-color:#cfc4ad;transform:translateY(-1px)}
.song-card.cur{border-color:var(--green);box-shadow:0 0 0 2px color-mix(in srgb,var(--green) 25%,transparent)}
.sc-top{display:flex;align-items:baseline;gap:8px}
.sc-num{font-family:"Playfair Display",serif;font-style:italic;color:var(--red);font-size:15px}
.sc-title{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sc-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0;align-self:center}
.sc-strip{display:flex;gap:2px;height:7px;margin:9px 0 7px;border-radius:4px;overflow:hidden;background:var(--line2)}
.sc-strip i{display:block;height:100%}
.sc-meta{font-size:11.5px;color:var(--muted);font-weight:500}

@media (max-width:760px){
 .top{padding:10px 14px}
 .album{font-size:17px}
 .song-head{padding:14px 14px 12px}
 .song-title{font-size:24px}
 .arr-wrap{margin:0 8px 10px;border-radius:12px}
 .arr{--lab:46px}
 .corner{padding:10px 6px;justify-content:center}
 .corner b{display:none}
 .row-label{padding:0;justify-content:center}
 .row-name{display:none}
 .note-label{padding:12px 0 0;justify-content:center}
 .note-label span{display:none}
 .mine-hint{margin:-4px 14px 12px}
 .songs{padding:8px 8px 10px}
 .song-card{flex-basis:160px;padding:8px 10px}
}
</style>
</head>

};
function ic(n,sz){return '<svg class="ic" width="'+(sz||16)+'" height="'+(sz||16)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||ICONS.note)+'</svg>'}
var INST={};
[["vox-lead","Лід-вокал","#b8463c","mic"],["vox-back","Бек-вокал","#d07462","micvocal"],["vox-choir","Міні-хор","#9c3a5c","choir"],["vox-duet","Дует","#c4648a","duet"],
 ["k-piano","Піаніно","#b7812a","piano"],["k-pad","Пад / синт","#cfa04c","pad"],["k-organ","Орган","#9a6620","organ"],["k-rhodes","Rhodes","#c18f5a","rhodes"],
 ["g-ac","Акустична гітара","#b4652f","acoustic"],["g-el","Електрогітара","#874424","electric"],
 ["r-bass","Бас","#2d5c84","bass"],["r-drums","Барабани","#3f71a0","drums"],["r-cajon","Кахон","#5a86b0","cajon"],["r-perc","Перкусія","#467a8e","perc"],["r-bells","Дзвіночки","#7192bb","bells"],
 ["o-violin","Скрипка","#2f7a5c","violin"],["o-cello","Віолончель","#225e48","cello"],["o-flute","Флейта","#5c9b7b","flute"]
].forEach(function(a,i){INST[a[0]]={name:a[1],color:a[2],icon:a[3],o:i}});
(D.custom||[]).forEach(function(c,i){INST[c.id]={name:c.name,color:c.color,icon:c.icon||"note",o:100+i}});
var SEC={intro:{l:"Вступ",c:"#8b8f86",i:"play"},verse:{l:"Куплет",c:"#4f7896",i:"verse"},pre:{l:"Пре-приспів",c:"#7c6aa6",i:"rise"},chorus:{l:"Приспів",c:"#b04a3e",i:"repeat"},bridge:{l:"Брідж",c:"#c2922c",i:"bridge"},inst:{l:"Програш",c:"#3d8466",i:"note"},tag:{l:"Тег",c:"#9a6b8a",i:"tag"},outro:{l:"Кінцівка",c:"#6b5d4f",i:"flag"},custom:{l:"Частина",c:"#5e6a70",i:"shapes"}};


ICONS.key=ICONS.note;ICONS.rec='<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.6" fill="currentColor" stroke="none"/>';ICONS.tree='<path d="M12 2.5 7 9h3l-4.5 6.5H10L5.5 21h13L14 15.5h4.5L14 9h3z"/>';
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function secLabel(sg,sec){if(sec.name)return sec.name;var t=SEC[sec.type]||SEC.custom;var same=sg.sections.filter(function(x){return x.type===sec.type});return same.length>1?t.l+" "+(same.indexOf(sec)+1):t.l}
function secWidth(sec,label){var b=+sec.bars||0,w=b?Math.round(Math.min(320,Math.max(124,70+b*6))):140;var lw=Math.min(300,Math.round(String(label||'').length*8.2+30));return Math.max(w,lw)}
function isOn(r,id){return !!(r.on&&r.on[id])}

var notes={};try{notes=JSON.parse(localStorage.getItem(NOTE_KEY)||"{}")||{}}catch(e){}
function saveNotes(){try{localStorage.setItem(NOTE_KEY,JSON.stringify(notes))}catch(e){}}
function nk(sg,s){return sg.id+":"+s.id}
function hasNotes(sg){return sg.sections.some(function(s){return (notes[nk(sg,s)]||"").trim()})}

var songs=D.songs||[];
function findIdx(id){return songs.findIndex(function(s){return s.id===id})}
var cur=findIdx(decodeURIComponent(location.hash.slice(1)));
if(cur<0){try{cur=findIdx(localStorage.getItem("xmas-live-song"))}catch(e){}}
if(cur<0)cur=0;
document.title=D.album||"Регламент";
var app=document.getElementById("app");

function render(){
 var sl=app.querySelector(".song-list"),keep=sl?sl.scrollLeft:0;
 var sg=songs[cur];
 app.innerHTML='<header class="top">'+ic("tree",22)+'<div class="album">'+esc(D.album||"")+'</div></header>'+
  '<main class="stage">'+(sg?renderSong(sg):'')+'</main>'+renderSongs();
 var nl=app.querySelector(".song-list"),cc=app.querySelector(".song-card.cur");if(nl){nl.scrollLeft=keep;if(cc){var l=cc.offsetLeft-nl.offsetLeft-8,r=l+cc.offsetWidth+16;if(l<nl.scrollLeft)nl.scrollLeft=l;else if(r>nl.scrollLeft+nl.clientWidth)nl.scrollLeft=r-nl.clientWidth}}
}
function renderSong(sg){
 var h='<div class="song-head"><div class="song-id"><div class="song-num">Пісня '+String(cur+1).padStart(2,"0")+'</div><h1 class="song-title">'+esc(sg.title)+'</h1></div><div class="meta">';
 if(sg.lead)h+='<span class="field">'+ic("mic",14)+'<b>'+esc(sg.lead)+'</b></span>';
 h+='<span class="field'+(sg.key?'':' q')+'">'+ic("note",14)+'<b>'+(sg.key?esc(sg.key):'?')+'</b></span>';
 if(sg.bpm)h+='<span class="field">'+ic("tempo",14)+'<b>'+esc(sg.bpm)+'</b>BPM</span>';
 if(sg.sig)h+='<span class="field"><b>'+esc(sg.sig)+'</b></span>';
 if(sg.notes)h+='<span class="field rec">'+ic("info",14)+esc(sg.notes)+'</span>';
 h+='</div></div><div class="arr-wrap">'+renderGrid(sg)+'</div>';
 return h;
}
function renderGrid(sg){
 var secs=sg.sections,rows=(sg.rows||[]).filter(function(r){return INST[r.inst]}).sort(function(a,b){return INST[a.inst].o-INST[b.inst].o});
 var cols='var(--lab,200px) '+secs.map(function(s){return secWidth(s,secLabel(sg,s))+'px'}).join(' ');
 var h='<div class="arr" style="grid-template-columns:'+cols+'"><div class="corner"><b>Інструменти</b></div>';
 secs.forEach(function(s,i){
  var t=SEC[s.type]||SEC.custom,inn=[],out=[];
  if(i>0)rows.forEach(function(r){var a=isOn(r,secs[i-1].id),b=isOn(r,s.id),n=INST[r.inst].name;if(b&&!a)inn.push(n);if(a&&!b)out.push(n)});
  var dh=(inn.length?'<i class="in" title="Вступають: '+esc(inn.join(", "))+'">+'+inn.length+'</i>':'')+(out.length?'<i class="out" title="Виходять: '+esc(out.join(", "))+'">−'+out.length+'</i>':'');
  h+='<div class="sec-head" style="--sc:'+t.c+'"><div class="sec-strip"></div><div class="sec-type">'+ic(t.i,12)+t.l+'</div><div class="sec-name" title="'+esc(secLabel(sg,s))+'">'+esc(secLabel(sg,s))+'</div><div class="sec-meta">'+(+s.bars?esc(s.bars)+' такт.':'')+'<span class="delta">'+dh+'</span></div></div>';
 });
 rows.forEach(function(r){
  var m=INST[r.inst];
  h+='<div class="row-label" style="--c:'+m.color+'" title="'+esc(m.name)+'"><span class="row-ic">'+ic(m.icon,16)+'</span><span class="row-name">'+esc(m.name)+'</span></div>';
  secs.forEach(function(s,i){
   var on=isOn(r,s.id),prev=i>0&&isOn(r,secs[i-1].id),next=i<secs.length-1&&isOn(r,secs[i+1].id);
   h+='<div class="cell'+(i%2?' odd':'')+'" style="--c:'+m.color+'">'+(on?'<div class="bar'+(prev?'':' s')+(next?'':' e')+'">'+(prev?'':'<span>'+esc(m.name)+'</span>')+'</div>':'')+'</div>';
  });
 });
 if(secs.some(function(s){return s.note})){
  h+='<div class="row-label note-label" title="Нотатки">'+ic("info",13)+'<span>Нотатки</span></div>';
  secs.forEach(function(s){h+='<div class="note-cell">'+esc(s.note||"")+'</div>'});
 }
 h+='<div class="row-label note-label mine" title="Мої нотатки">'+ic("pencil",13)+'<span>Мої нотатки</span></div>';
 secs.forEach(function(s){var k=nk(sg,s);h+='<div class="my-cell"><textarea data-k="'+esc(k)+'" placeholder="моя нотатка…">'+esc(notes[k]||"")+'</textarea></div>'});
 return h+'</div>';
}
function renderSongs(){
 var h='<footer class="songs"><div class="song-list">';
 songs.forEach(function(sg,i){
  h+='<button class="song-card'+(i===cur?' cur':'')+'" data-i="'+i+'"><div class="sc-top"><span class="sc-num">'+(i+1)+'</span><span class="sc-title">'+esc(sg.title||"")+'</span>'+(hasNotes(sg)?'<span class="sc-dot" title="Є мої нотатки"></span>':'')+'</div><div class="sc-strip">';
  sg.sections.forEach(function(s){h+='<i style="flex:'+(+s.bars||8)+';background:'+(SEC[s.type]||SEC.custom).c+'"></i>'});
  h+='</div><div class="sc-meta">'+[sg.lead,sg.key,sg.bpm?sg.bpm+' BPM':''].filter(Boolean).map(esc).join(' · ')+'</div></button>';
 });
 return h+'</div></footer>';
}
function go(i){if(i<0||i>=songs.length||i===cur)return;cur=i;try{localStorage.setItem("xmas-live-song",songs[i].id)}catch(e){}history.replaceState(null,"","#"+songs[i].id);render()}
app.addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(b)go(+b.dataset.i)});
app.addEventListener("input",function(e){var t=e.target;if(t.tagName!=="TEXTAREA")return;var k=t.dataset.k;if(t.value.trim())notes[k]=t.value;else delete notes[k];saveNotes()});
app.addEventListener("focusout",function(e){if(e.target.tagName==="TEXTAREA"){var c=app.querySelector(".song-card.cur .sc-top"),has=hasNotes(songs[cur]),d=c&&c.querySelector(".sc-dot");if(c&&has&&!d)c.insertAdjacentHTML("beforeend",'<span class="sc-dot" title="Є мої нотатки"></span>');if(d&&!has)d.remove()}});
window.addEventListener("hashchange",function(){var i=findIdx(decodeURIComponent(location.hash.slice(1)));if(i>=0)go(i)});
render();
})();
</script>
</body>
</html>
