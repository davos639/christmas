<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#21463a">
<title>Різдвяний лайв — регламент</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<style>
:root{--bg:#f4efe4;--paper:#fffdf8;--ink:#1d2621;--muted:#6f726b;--faint:#a19e94;--line:#e3dac8;--line2:#efe8da;--green:#2c5a45;--green-d:#21463a;--gold:#d2a23e;--shadow:0 1px 2px rgba(40,30,10,.05),0 10px 28px -14px rgba(40,30,10,.22)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{display:block;flex-shrink:0}

/* header */
.hero{background:var(--green-d);color:#f6efe0;padding:22px 20px 0;padding-top:max(22px,env(safe-area-inset-top))}
.hero-in{max-width:760px;margin:0 auto}
.album{display:flex;align-items:center;gap:10px;font-family:"Playfair Display",serif;font-size:22px;font-weight:600;letter-spacing:.2px}
.album .ic{color:var(--gold)}
.tabs-wrap{position:sticky;top:0;z-index:5;background:var(--green-d);box-shadow:0 6px 18px -12px rgba(0,0,0,.5)}
.tabs{max-width:760px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:16px 20px 14px;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;scroll-snap-align:start;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#efe6d3;border-radius:14px;padding:8px 14px 8px 8px;text-align:left;transition:background .15s,border-color .15s}
.tab:hover{background:rgba(255,255,255,.12)}
.tab .n{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-weight:800;font-size:12.5px}
.tab .t{font-weight:700;font-size:13.5px;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.tab .l{font-size:11.5px;opacity:.65}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:2px}
.tab.on{background:#f6efe0;border-color:#f6efe0;color:var(--green-d)}
.tab.on .n{background:var(--gold);color:#2b2210}

main{max-width:760px;margin:0 auto;padding:26px 20px 60px}
.song-title{font-family:"Playfair Display",serif;font-size:32px;line-height:1.12;font-weight:600;margin:0 0 14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 13px 6px 10px;font-weight:700;font-size:13.5px}
.pill .ic{color:var(--green)}
.pill small{font-weight:600;color:var(--muted);font-size:12px}
.pill.q{color:var(--faint)}
.callout{display:flex;gap:10px;background:#f8eed4;border:1px solid #ecdcae;color:#5e4a19;border-radius:14px;padding:11px 14px;font-size:13.5px;margin-bottom:18px}
.callout .ic{margin-top:2px;color:#b58a28}

/* structure strip */
.strip{display:flex;gap:3px;height:12px;margin:6px 0 24px}
.strip button{border:0;padding:0;border-radius:4px;min-width:6px;opacity:.9;transition:opacity .15s,transform .15s}
.strip button:hover{opacity:1;transform:scaleY(1.35)}

/* sections */
.secs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.sec{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:90px}
.sec::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.sec-head{display:flex;align-items:center;gap:12px;padding:13px 14px 13px 18px}
.num{width:24px;font-weight:800;font-size:12.5px;color:var(--faint);text-align:center;flex-shrink:0}
.badge{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);flex-shrink:0}
.sec-main{flex:1;min-width:0}
.sec-name{font-weight:800;font-size:15.5px}
.sec-chords{color:var(--muted);font-size:13.5px;margin-top:1px}
.bars{flex-shrink:0;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--line2);border-radius:999px;padding:3px 10px}
.note-btn{flex-shrink:0;width:36px;height:36px;border-radius:11px;border:1px solid transparent;background:transparent;color:var(--faint);display:grid;place-items:center;transition:background .15s,color .15s}
.note-btn:hover{background:var(--line2);color:var(--ink)}
.note-btn.has{color:var(--gold)}
.insts{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 13px 88px;margin-top:-4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px 3px 7px;background:color-mix(in srgb,var(--ic) 11%,transparent);color:var(--ic)}
.chip.in{background:var(--ic);color:#fff}
.chip.out{background:transparent;color:var(--faint);text-decoration:line-through;border:1px dashed var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:-12px 0 18px;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:10px;border-radius:999px;display:inline-block}
.mynote{border-top:1px dashed var(--line);background:#fffaf0;padding:10px 16px 12px 88px;display:none}
.sec.open .mynote,.sec.hasnote .mynote{display:block}
.mynote label{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#a07d2a;margin-bottom:4px}
.mynote textarea{width:100%;border:0;background:transparent;resize:none;padding:0;min-height:24px;font-size:14.5px;line-height:1.45;outline:none;overflow:hidden}
.mynote textarea::placeholder{color:var(--faint)}
.saved{margin-left:auto;font-weight:700;text-transform:none;letter-spacing:0;color:var(--green);opacity:0;transition:opacity .3s}
.saved.show{opacity:1}

.next{margin-top:26px;display:flex;justify-content:space-between;gap:10px}
.next button{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line);border-radius:14px;padding:10px 14px;color:var(--ink);font-weight:700;font-size:13.5px;max-width:48%;text-align:left}
.next button:hover{background:var(--paper)}
.next button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.next .r{margin-left:auto;text-align:right}
.foot{text-align:center;color:var(--faint);font-size:12px;margin-top:34px}

@media (min-width:820px){.tabs{flex-wrap:wrap}}
@media (max-width:560px){
 .hero{padding-left:16px;padding-right:16px}
 .album{font-size:19px}
 .tabs{padding-left:16px;padding-right:16px}
 main{padding:22px 14px 50px}
 .song-title{font-size:27px}
 .sec-head{gap:10px;padding:12px 10px 12px 14px}
 .num{display:none}
 .badge{width:30px;height:30px;border-radius:10px}
 .insts,.mynote{padding-left:56px}
}
</style>
</head>
<body>
<header class="hero"><div class="hero-in"><div class="album" id="album"></div></div></header>
<nav class="tabs-wrap"><div class="tabs" id="tabs"></div></nav>
<main id="main"></main>

};
function ic(n,sz){return '<svg class="ic" width="'+(sz||16)+'" height="'+(sz||16)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||ICONS.note)+'</svg>'}
var INST={};
[["vox-lead","Лід-вокал","#b8463c","mic"],["vox-back","Бек-вокал","#d07462","micvocal"],["vox-choir","Міні-хор","#9c3a5c","choir"],["vox-duet","Дует","#c4648a","duet"],
 ["k-piano","Піаніно","#b7812a","piano"],["k-pad","Пад / синт","#cfa04c","pad"],["k-organ","Орган","#9a6620","organ"],["k-rhodes","Rhodes","#c18f5a","rhodes"],
 ["g-ac","Акустична гітара","#b4652f","acoustic"],["g-el","Електрогітара","#874424","electric"],
 ["r-bass","Бас","#2d5c84","bass"],["r-drums","Барабани","#3f71a0","drums"],["r-cajon","Кахон","#5a86b0","cajon"],["r-perc","Перкусія","#467a8e","perc"],["r-bells","Дзвіночки","#7192bb","bells"],
 ["o-violin","Скрипка","#2f7a5c","violin"],["o-cello","Віолончель","#225e48","cello"],["o-flute","Флейта","#5c9b7b","flute"]
].forEach(function(a,i){INST[a[0]]={name:a[1],color:a[2],icon:a[3],o:i}});
(D.custom||[]).forEach(function(c,i){INST[c.id]={name:c.name,color:c.color,icon:c.icon||"note",o:100+i}});
var SEC={intro:{l:"Вступ",c:"#8b8f86",i:"play"},verse:{l:"Куплет",c:"#4f7896",i:"verse"},pre:{l:"Пре-приспів",c:"#7c6aa6",i:"rise"},chorus:{l:"Приспів",c:"#b04a3e",i:"repeat"},bridge:{l:"Брідж",c:"#c2922c",i:"bridge"},inst:{l:"Програш",c:"#3d8466",i:"note"},tag:{l:"Тег",c:"#9a6b8a",i:"tag"},outro:{l:"Кінцівка",c:"#6b5d4f",i:"flag"},custom:{l:"Частина",c:"#5e6a70",i:"shapes"}};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function secLabel(sg,sec){if(sec.name)return sec.name;var t=SEC[sec.type]||SEC.custom;var same=sg.sections.filter(function(x){return x.type===sec.type});return same.length>1?t.l+" "+(same.indexOf(sec)+1):t.l}
function bars(n){n=+n;if(!n)return "";var m=n%10,h=n%100;var w=(m===1&&h!==11)?"такт":(m>=2&&m<=4&&(h<12||h>14))?"такти":"тактів";return n+" "+w}

var notes={};try{notes=JSON.parse(localStorage.getItem(NOTE_KEY)||"{}")||{}}catch(e){}
function saveNotes(){try{localStorage.setItem(NOTE_KEY,JSON.stringify(notes))}catch(e){}}
function nk(sg,sec){return sg.id+":"+sec.id}
function songHasNotes(sg){return sg.sections.some(function(s){return (notes[nk(sg,s)]||"").trim()})}

var songs=D.songs||[];
var cur=(function(){var h=decodeURIComponent(location.hash.slice(1));var i=songs.findIndex(function(s){return s.id===h});if(i<0){try{i=songs.findIndex(function(s){return s.id===localStorage.getItem("xmas-live-song")})}catch(e){}}return i<0?0:i})();

document.getElementById("album").innerHTML=ic("star",20)+esc(D.album||"");
document.title=(D.album||"Регламент");

function renderTabs(){
 document.getElementById("tabs").innerHTML=songs.map(function(sg,i){
  return '<button class="tab'+(i===cur?' on':'')+'" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span><span class="t">'+esc(sg.title)+'</span>'+(sg.lead?'<br><span class="l">'+esc(sg.lead)+'</span>':'')+'</span>'+(songHasNotes(sg)?'<span class="dot" title="Є ваші нотатки"></span>':'')+'</button>';
 }).join("");
 var on=document.querySelector(".tab.on"),bar=document.getElementById("tabs");if(on){var l=on.offsetLeft-16,r=on.offsetLeft+on.offsetWidth+16;if(l<bar.scrollLeft)bar.scrollLeft=l;else if(r>bar.scrollLeft+bar.clientWidth)bar.scrollLeft=r-bar.clientWidth}
}

function render(){
 var sg=songs[cur];if(!sg){document.getElementById("main").innerHTML="";return}
 renderTabs();
 var h='<h1 class="song-title">'+esc(sg.title)+'</h1><div class="meta">';
 if(sg.lead)h+='<span class="pill">'+ic("mic",15)+esc(sg.lead)+'</span>';
 h+=sg.key?'<span class="pill">'+ic("note",15)+esc(sg.key)+'</span>':'<span class="pill q">'+ic("note",15)+'тональність ?</span>';
 if(sg.bpm)h+='<span class="pill">'+ic("tempo",15)+esc(sg.bpm)+' <small>BPM</small></span>';
 if(sg.sig)h+='<span class="pill">'+ic("sig",15)+esc(sg.sig)+'</span>';
 h+='</div>';
 if(sg.notes)h+='<div class="callout">'+ic("info",16)+'<div>'+esc(sg.notes)+'</div></div>';
 var tot=sg.sections.reduce(function(a,s){return a+(+s.bars||8)},0)||1;
 h+='<div class="strip">'+sg.sections.map(function(s){var t=SEC[s.type]||SEC.custom;return '<button style="flex:'+(+s.bars||8)+';background:'+t.c+'" data-go="'+s.id+'" title="'+esc(secLabel(sg,s))+'" aria-label="'+esc(secLabel(sg,s))+'"></button>'}).join("")+'</div>';
 var rows=(sg.rows||[]).filter(function(r){return INST[r.inst]}).sort(function(a,b){return INST[a.inst].o-INST[b.inst].o});
 if(rows.length)h+='<div class="legend"><span><i style="background:var(--green)"></i>вступає</span><span><i style="background:color-mix(in srgb,var(--green) 14%,transparent)"></i>грає далі</span><span><i style="border:1px dashed var(--faint)"></i>виходить</span></div>';
 h+='<ol class="secs">';
 sg.sections.forEach(function(s,i){
  var t=SEC[s.type]||SEC.custom, prev=sg.sections[i-1], k=nk(sg,s), nt=notes[k]||"";
  var playing=rows.filter(function(r){return r.on&&r.on[s.id]&&INST[r.inst]});
  var gone=prev?rows.filter(function(r){return r.on&&r.on[prev.id]&&!r.on[s.id]&&INST[r.inst]}):[];
  h+='<li class="sec'+(nt.trim()?' hasnote':'')+'" id="s-'+s.id+'" style="--c:'+t.c+'"><div class="sec-head"><span class="num">'+(i+1)+'</span><span class="badge">'+ic(t.i,17)+'</span><div class="sec-main"><div class="sec-name">'+esc(secLabel(sg,s))+'</div>'+(s.note?'<div class="sec-chords">'+esc(s.note)+'</div>':'')+'</div>'+(bars(s.bars)?'<span class="bars">'+bars(s.bars)+'</span>':'')+'<button class="note-btn'+(nt.trim()?' has':'')+'" data-note="'+s.id+'" title="Моя нотатка" aria-label="Моя нотатка">'+ic("pencil",17)+'</button></div>';
  if(playing.length||gone.length){
   h+='<div class="insts">'+playing.map(function(r){var m=INST[r.inst],isNew=i>0&&!(prev&&r.on[prev.id]);return '<span class="chip'+(isNew?' in':'')+'" style="--ic:'+m.color+'" title="'+(isNew?'Вступає':'Грає')+'">'+ic(m.icon,13)+esc(m.name)+'</span>'}).join("")+gone.map(function(r){var m=INST[r.inst];return '<span class="chip out" style="--ic:'+m.color+'" title="Виходить">'+ic(m.icon,13)+esc(m.name)+'</span>'}).join("")+'</div>';
  }
  h+='<div class="mynote"><label>'+ic("pencil",12)+'Моя нотатка<span class="saved">збережено</span></label><textarea rows="1" data-k="'+esc(k)+'" placeholder="Що мені тут важливо не забути…">'+esc(nt)+'</textarea></div></li>';
 });
 h+='</ol>';
 var p=songs[cur-1],n=songs[cur+1];
 if(p||n)h+='<div class="next">'+(p?'<button data-i="'+(cur-1)+'">'+ic("left",16)+'<span><small>Попередня</small>'+esc(p.title)+'</span></button>':'<i></i>')+(n?'<button class="r" data-i="'+(cur+1)+'"><span><small>Наступна</small>'+esc(n.title)+'</span>'+ic("right",16)+'</button>':'')+'</div>';
 h+='<div class="foot">Нотатки бачите тільки ви — вони зберігаються в цьому браузері.</div>';
 document.getElementById("main").innerHTML=h;
 document.querySelectorAll("textarea").forEach(grow);
}
function grow(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"}
function go(i){if(i<0||i>=songs.length)return;cur=i;try{localStorage.setItem("xmas-live-song",songs[i].id)}catch(e){}history.replaceState(null,"","#"+songs[i].id);render();window.scrollTo({top:0})}

document.addEventListener("click",function(e){
 var b=e.target.closest("[data-i]");if(b){go(+b.dataset.i);return}
 var g=e.target.closest("[data-go]");if(g){var el=document.getElementById("s-"+g.dataset.go);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return}
 var nb=e.target.closest("[data-note]");if(nb){var li=nb.closest(".sec");li.classList.add("open");var ta=li.querySelector("textarea");grow(ta);ta.focus();return}
});
var timers={};
document.addEventListener("input",function(e){
 var t=e.target;if(t.tagName!=="TEXTAREA")return;grow(t);
 var k=t.dataset.k;if(t.value.trim())notes[k]=t.value;else delete notes[k];saveNotes();
 var li=t.closest(".sec");li.classList.toggle("hasnote",!!t.value.trim());li.querySelector(".note-btn").classList.toggle("has",!!t.value.trim());
 var sv=li.querySelector(".saved");sv.classList.add("show");clearTimeout(timers[k]);timers[k]=setTimeout(function(){sv.classList.remove("show")},1200);
});
document.addEventListener("focusout",function(e){var t=e.target;if(t.tagName==="TEXTAREA"&&!t.value.trim()){var li=t.closest(".sec");li.classList.remove("open");renderTabs()}else if(t.tagName==="TEXTAREA")renderTabs()});
window.addEventListener("hashchange",function(){var i=songs.findIndex(function(s){return s.id===decodeURIComponent(location.hash.slice(1))});if(i>=0&&i!==cur){cur=i;render()}});
render();
})();
</script>
</body>
</html>
